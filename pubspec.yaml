name: linguaflow_ai
publish_to: none
description: Zeluvori AI - tradutor bilateral com mascote animado e reconhecimento local no Android.
version: 0.9.0+9

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.1
  google_mlkit_translation: ^0.13.1
  google_mlkit_language_id: ^0.13.1
  flutter_tts: ^4.2.5
  whisper_ggml: ^2.8.1
  record: ^6.1.2
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
