name: linguaflow_ai
publish_to: none
description: Tradutor bilateral sem API paga, com reconhecimento e tradução no dispositivo Android.
version: 0.5.0+5

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.1
  google_mlkit_translation: ^0.13.1
  google_mlkit_language_id: ^0.13.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
