name: APK leve LinguaFlow Galaxy A14 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - test/android-emulator-smoke
    paths:
      - .github/workflows/gerar-apk-leve.yml
      - lib/**
      - native_android/**
      - test/**
      - pubspec.yaml

permissions:
  contents: read

jobs:
  apk-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Incluir Whisper multilingue no APK
        run: |
          mkdir -p assets/models
          curl -fL --retry 3 --connect-timeout 20 --max-time 300 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/f281eb45af861ab5e5297d23694b7d46e090c02c/ggml-tiny-q5_1.bin' \
            -o assets/models/ggml-tiny-q5_1.bin
          echo '818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  assets/models/ggml-tiny-q5_1.bin' | sha256sum -c -

      - name: Preparar app Android
        run: |
          flutter create . --platforms android
          python3 setup_android.py
          flutter pub get
          rm -f test/widget_test.dart

      - name: Testes automatizados
        run: flutter test

      - name: Aceitar licencas Android e preparar NDK Whisper
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --licenses < <(printf 'y\n%.0s' {1..100}) >/dev/null
          "$SDKMANAGER" --install 'ndk;29.0.13113456'

      - name: Gerar APK compacto ARM64
        run: flutter build apk --release --target-platform android-arm64

      - name: Validar artefato
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Disponibilizar APK ARM64
        uses: actions/upload-artifact@v4
        with:
          name: LinguaFlow-V09-A14-ARM64-WHISPER-10-IDIOMAS
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
